name: Daily Market Email

on:
  schedule:
    - cron: '47 14 * * 1-5'   # 10:47 AM ET (EDT) / 9:47 AM ET (EST) — primary
    - cron: '23 16 * * 1-5'   # 12:23 PM ET (EDT) / 11:23 AM ET (EST) — backup
  workflow_dispatch:            # manual trigger from GitHub UI

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Send daily email
        run: python stockSender.py
        env:
          EMAIL_ADDRESS:     ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL:          ${{ secrets.TO_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Commit daily_send_state.json so the backup run knows the primary already fired
      - name: Save send state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add daily_send_state.json
          git diff --cached --quiet || git commit -m "chore: update daily send state [skip ci]"
          git push
